<div class="selected-field-wrapper" data-field="{{ field_name }}">
    <button
        type="button"
        data-field="{{ field_name }}"
        hx-post="{% url 'leads:remove_field' %}"
        hx-vals='{"field_name": "{{ field_name }}"}'
        hx-target="closest .selected-field-wrapper"
        hx-swap="outerHTML"
        hx-trigger="click"
        class="selected-field mb-1 bg-red-100 border border-dark-50 rounded-md px-2 py-2 text-xs font-medium w-full text-start hover:bg-red-200 transition relative shadow-sm"
    >
        {{ field_verbose }}
        <span
            class="absolute end-2 top-1 w-5 h-5 inline-flex items-center justify-center text-red-600 text-base leading-none"
        >×</span>
    </button>

    <input type="hidden" name="selected_fields[]" value="{{ field_name }}">
</div>

<script>
    document.querySelector('[data-field="{{ field_name|escapejs }}"].available-field').style.display = 'none';
    htmx.trigger('#colorPicker', 'change');
</script>
