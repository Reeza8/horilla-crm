<div class="p-5">
    {% modal_header _("Filter") on_close="closeFilterModal()" %}
    <form
        hx-get="{{ request.path }}"
        hx-target="#history-main"
        hx-swap="innerHTML"
        hx-trigger="submit"
        hx-select="#history-main"
        class="space-y-4"
        hx-on::after-request="closeFilterModal()"
    >
        <label for="{{ form.filter_date.id_for_label }}" class="block text-sm font-medium text-gray-700">
            {% trans "Select date to filter" %}
        </label>
        {{ form.filter_date }}

        <div class="flex justify-end">
            <button type="submit" class="bg-primary-600 rounded-md hover:bg-primary-800 transition duration-300 text-white text-sm px-4 py-2">
                {% trans "Apply" %}
            </button>
        </div>
    </form>
    <script>
        (function () {
            var box = document.getElementById("filtermodalBox");
            if (box) {
                htmx.trigger(box, "horilla:content-loaded");
            }
        })();
    </script>
</div>
