<div class="empty-state flex flex-col items-center{% if wrapper_class %} {{ wrapper_class }}{% endif %}">
    {% if spacer %}
        <div class="flex justify-between items-center h-20"></div>
    {% endif %}
    <img
        src="{% static image|default:'assets/img/not-found.svg' %}"
        alt="{{ alt|default:'' }}"
        class="w-60 m-auto mb-4 mt-5"
    >
    {% if message %}
        <p class="text-sm text-center mb-3">{{ message }}</p>
    {% endif %}
    {% if action_url %}
        <div class="flex justify-center">
            {% btn action_label tag="a" href=action_url %}
        </div>
    {% endif %}
</div>
