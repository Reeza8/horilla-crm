{% load static i18n %}
<div class="relative bg-white rounded-lg shadow-sm">
    <form
        hx-post="{% url 'calls:click_to_call' %}"
        hx-target="#modalBox"
        hx-swap="innerHTML"
    >
        {% csrf_token %}
        <input type="hidden" name="to_number" value="{{ phone_number }}">
        <input type="hidden" name="from_number" value="">
        <input type="hidden" name="related_model_name" value="{{ related_model_name }}">
        <input type="hidden" name="related_object_id" value="{{ related_object_id }}">

        <div class="p-5">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-md font-semibold">
                    {% trans "Call" %} {{ phone_number }}
                </h2>
                <button
                    type="button"
                    onclick="closeModal()"
                    class="text-gray-500 hover:text-red-500 text-xl cursor-pointer"
                >
                    <img src="{% static 'assets/icons/close.svg' %}" alt="{% trans 'Close' %}">
                </button>
            </div>

            <div class="grid grid-cols-1 gap-4 mb-4">
                <div class="flex flex-col">
                    <label for="id_provider_id" class="text-xs text-color-600 mb-1">
                        {% trans "Provider" %} <span class="text-red-500">*</span>
                    </label>
                    <select
                        id="id_provider_id"
                        name="provider_id"
                        class="js-example-basic-single headselect w-full"
                        required
                    >
                        <option value="">{% trans "Select provider..." %}</option>
                        {% for provider in providers %}
                            <option value="{{ provider.pk }}">{{ provider.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="flex justify-end p-5 pt-0 gap-2">
            <button
                type="button"
                onclick="closeModal()"
                class="text-sm px-4 py-2 border border-primary-600 rounded-md hover:bg-primary-600 hover:text-[white] transition duration-300 text-primary-600"
            >
                {% trans "Cancel" %}
            </button>
            <button
                type="submit"
                class="text-sm px-4 py-2 bg-primary-600 rounded-md hover:bg-primary-800 transition duration-300 text-[white]"
            >
                {% trans "Call Now" %}
            </button>
        </div>
    </form>
</div>

<script>
    (function () {
        var sel = document.getElementById('id_provider_id');
        if (sel && window.$) {
            $(sel).select2({ width: '100%', dropdownParent: $(sel).closest('.oh-modal-content') });
        }
    })();
</script>
