{% load static i18n %}
<div class="relative bg-white rounded-lg shadow-sm text-center mx-auto w-72" id="call-success-modal">
    <div class="p-8">
        <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-phone fa-lg text-green-600 animate-pulse"></i>
        </div>
        <h2 class="text-md font-semibold text-gray-800 mb-1">{% trans "Calling..." %}</h2>
        <p class="text-sm text-gray-500 mt-1">{{ call_log.to_number }}</p>
        <p class="text-xs text-gray-400 mt-1">{% trans "via" %} {{ call_log.provider }}</p>
        <div class="flex justify-center gap-1 mt-4">
            <span class="w-2 h-2 rounded-full bg-primary-600 animate-bounce [animation-delay:0ms]"></span>
            <span class="w-2 h-2 rounded-full bg-primary-600 animate-bounce [animation-delay:200ms]"></span>
            <span class="w-2 h-2 rounded-full bg-primary-600 animate-bounce [animation-delay:400ms]"></span>
        </div>
    </div>
</div>

<script>
    setTimeout(function () {
        closeModal();
    }, 2500);
</script>
