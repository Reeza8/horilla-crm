{% load i18n %}
{% for member in items %}
    <label
        class="team-member-item flex items-center gap-3 cursor-pointer transition-colors hover:bg-gray-50"
        style="padding: 6px 12px;"
    >
        <input
            type="checkbox"
            class="team-member-checkbox w-4 h-4 bg-[#E9EDF7] rounded accent-[#e54f38] cursor-pointer flex-shrink-0"
            value="{{ member.id }}"
            data-name="{{ member.name }}"
        >
        <span class="rounded-full bg-primary-100 text-primary-600 font-semibold flex items-center justify-center flex-shrink-0" style="width: 24px; height: 24px; font-size: 11px;">{{ member.name|slice:":1"|upper }}</span>
        <span class="min-w-0">
            <span class="block text-sm text-gray-800 truncate" style="line-height: 1.25;" title="{{ member.name }}">{{ member.name }}{% if member.is_me %} ({% trans 'Me' %}){% endif %}</span>
            {% if member.role %}
                <span class="block text-gray-400 truncate" style="font-size: 11px; line-height: 1.2;">{{ member.role }}</span>
            {% endif %}
        </span>
    </label>
{% empty %}
    {% if page_obj.number == 1 %}
        <div class="text-center text-sm text-gray-400 py-6">{% trans 'No results found' %}</div>
    {% endif %}
{% endfor %}
{% if page_obj.has_next %}
    <div
        style="height: 1px; padding: 0; margin: 0; border: none"
        hx-get="{% url 'calendar:team_members_list' %}?search={{ search|urlencode }}&selected={{ selected|urlencode }}&page={{ page_obj.next_page_number }}"
        hx-trigger="intersect once"
        hx-swap="outerHTML"
        hx-target="this"
        hx-push-url="false"
        hx-indicator="#teamMembersLoading"
    >
    </div>
{% endif %}
