{% if items %}
    <div class="flex flex-wrap gap-2">
        {% for item in items %}
            <span
                class="inline-flex items-center gap-1.5 text-xs text-primary-700 border border-primary-300 bg-primary-100 rounded-md px-2.5 py-1.5"
            >
                <svg class="w-3.5 h-3.5 text-primary-700 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        fill-rule="evenodd"
                        d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                        clip-rule="evenodd"
                    />
                </svg>
                {{ item.name }}
            </span>
        {% endfor %}
    </div>
{% else %}
    <p class="text-sm text-gray-400 text-center py-8">{{ empty_msg }}</p>
{% endif %}
