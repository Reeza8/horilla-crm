<div class="p-5 max-w-full">
    {# ── Header ── #}
    <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-2">
            <h3 class="text-sm font-semibold text-gray-800">{{ title }}</h3>
            {% if total %}
                <span
                    class="inline-flex items-center text-xs font-semibold text-white bg-primary-600 px-2 py-0.5 rounded-full"
                >
                    {{ total }}
                </span>
            {% endif %}
        </div>
        <button type="button" onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-xl cursor-pointer">
            <img src="{% static 'assets/icons/close.svg' %}" alt="{% trans 'Close' %}">
        </button>
    </div>

    {# ── Search ── #}
    {% if total %}
        <div class="relative mb-3">
            <input
                type="text"
                name="q"
                autocomplete="off"
                placeholder="{% trans 'Search users...' %}"
                hx-get="{{ request.path }}"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#assigneesList"
                hx-swap="innerHTML"
                class="w-full h-9 {% if LANGUAGE_BIDI %}pr-9 pl-3{% else %}pl-9 pr-3{% endif %} rounded-lg border border-dark-50 bg-slate-50 text-[13px] text-slate-800 placeholder:text-slate-400 outline-none focus:bg-white focus:ring-2 focus:ring-primary-100 transition"
            >
            <i
                class="fas fa-search absolute {% if LANGUAGE_BIDI %}right-[10px]{% else %}left-[10px]{% endif %} top-[9px] text-dark-400"
            ></i>
        </div>
    {% endif %}

    {# ── Chip grid ── #}
    <div id="assigneesList" class="max-h-80 overflow-y-auto custom-scroll pr-1">
        {% include "activity_assignees_list.html" %}
    </div>
</div>
