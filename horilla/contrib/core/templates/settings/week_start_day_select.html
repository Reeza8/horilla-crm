<div
    id="week_start_day_container"
    class="{% if 'week_start_day' in full_width_fields %}col-span-2{% else %}col-span-1{% endif %} flex flex-col"
>
    <label for="{{ form.week_start_day.id_for_label }}" class="text-xs text-gray-600 mb-1 font-medium">
        {{ form.week_start_day.label }}
        {% if form.week_start_day.field.required %}
            <span class="text-red-500">*</span>
        {% endif %}
    </label>
    <select
        name="week_start_day"
        id="{{ form.week_start_day.id_for_label }}"
        class="js-example-basic-single w-full text-sm"
        hx-get="{% url 'core:calculate_start_date_day' %}"
        hx-target="#start_date_day_container"
        hx-swap="outerHTML"
        hx-include="[name='start_date_month'],[name='week_start_day']"
        hx-trigger="change"
        {% if form.week_start_day.field.required %}
            required
        {% endif %}
    >
        <option value="">{% trans "Select" %} {{ form.week_start_day.label }}</option>
        {% for value, label in form.week_start_day.field.choices %}
            <option value="{{ value }}" {% if week_start_day_value == value %}selected{% endif %}>
                {{ label }}
            </option>
        {% endfor %}
    </select>
    {% if form.week_start_day.errors %}
        <div class="bg-red-50 text-red-500 px-3 py-2 rounded text-xs mt-1">
            {% for error in form.week_start_day.errors %}
                {{ error }}
            {% endfor %}
        </div>
    {% endif %}
</div>
