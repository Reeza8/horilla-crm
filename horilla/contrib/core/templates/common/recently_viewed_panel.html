<div id="recently-viewed-panel" {% if oob %}hx-swap-oob="true"{% endif %}>
    <div class="px-4 pt-2 pb-3 flex justify-between items-center">
        <h5 class="font-semibold text-base">{% trans "Recently Viewed" %}</h5>
        {% if recently_viewed_items %}
            <button
                type="button"
                hx-post="{% url 'core:recently_viewed_clear' %}"
                hx-target="#recently-viewed-panel"
                hx-swap="outerHTML"
                class="text-primary-600 text-sm hover:text-red-600 transition duration-300"
            >
                {% trans "Clear" %}
            </button>
        {% endif %}
    </div>
    {% include 'common/recently_viewed_list.html' %}
</div>
