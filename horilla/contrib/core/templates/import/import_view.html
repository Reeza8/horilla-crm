{% extends "settings/settings.html" %}
{% block settings %}
    {% has_perm "core.can_view_horilla_import" as view_horilla_import %}
    {% if view_horilla_import %}
        <div id="import-view" class="h-full flex flex-col">
            <div
                id="navBar"
                class="flex-shrink-0 mb-2"
                hx-get="{% url 'core:import_nav_view' %}"
                hx-trigger="load"
            >
            </div>

            <div
                class="border border-primary-300 rounded-lg border-t-0 pb-3 flex-1 min-h-0 flex flex-col"
                hx-push-url="false"
                hx-get="{% url 'core:import_tab_view' %}?{{request.GET.urlencode}}"
                hx-trigger="load"
            >
            </div>
        </div>
    {% else %}
        {% include "403.html" with embed=True %}
    {% endif %}
{% endblock %}
