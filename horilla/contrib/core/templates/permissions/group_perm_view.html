{% extends "settings/settings.html" %}
{% block settings %}
    <div id="permission-view" class="h-full min-h-0 flex flex-col overflow-hidden">
        <div class="mb-4 shrink-0">
            <div class="flex flex-col mb-2">
                <h3 class="text-md font-semibold">
                    {% trans "Roles and Permissions" %}
                </h3>
                <p class="text-xs text-gray-500">
                    {% trans "Control what each role can view, create, edit, or delete." %}
                    <strong>{% trans "Note:" %}</strong>
                    {% trans "To manage field-level permissions, simply click the name of a model." %}
                </p>
            </div>
        </div>
        <div
            class="flex-1 min-h-0 flex flex-col overflow-hidden"
            hx-push-url="false"
            hx-get="{% url 'core:role_permission_tab' %}?{{request.GET.urlencode}}"
            hx-trigger="load"
        >
        </div>
    </div>
{% endblock %}
