{% load reports_tags %}
{% for field in available_fields %}
    <button
        class="mb-1 bg-dark-50 rounded-md px-1.5 py-2 text-xs font-medium w-full text-start relative before:content-['+'] before:end-2 before:absolute before:text-lg before:top-0 before:bottom-0 before:m-auto"
        hx-post="{% url 'reports:add_filter_field' report.pk %}"
        hx-vals='{"field_name": "{{ field.name }}"}'
        hx-target="#panel"
        hx-swap="outerHTML"
        hx-indicator="#loading-indicator"
    >
        {{ field.verbose_name|title }}
    </button>
{% empty %}
    <div class="text-center text-gray-500 py-4 text-xs">
        {% trans "No fields found matching your search" %}
    </div>
{% endfor %}
