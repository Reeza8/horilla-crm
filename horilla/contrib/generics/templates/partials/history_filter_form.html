<div class="p-5">
    {% modal_header _("Filter") on_close="closeFilterModal()" %}
    <form
        hx-get="{{ request.path }}"
        hx-target="#history-main"
        hx-swap="innerHTML"
        hx-trigger="submit"
        hx-select="#history-main"
        class="space-y-4"
        hx-on::after-request="closeFilterModal()"
    >
        {{ form.filter_date.label_tag }}
        {{ form.filter_date }}

        <div class="text-end pt-2">
            <button type="submit" class="bg-primary-600 text-white text-sm px-4 py-2 rounded shadow">
                {% trans "Apply" %}
            </button>
        </div>
    </form>
</div>
