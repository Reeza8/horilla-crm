{% load i18n %}
{% trans "Expand" as detail_tab_expand_label %}
{% trans "Collapse" as detail_tab_collapse_label %}
<style>
    .htmx-indicator {
        display: none !important;
    }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator {
        display: flex !important;
    }

    .detail-tab-expand-btn {
        flex-shrink: 0;
    }

    /* Grow the active tab pane by hiding the detail header/pipeline strip. */
    #detailViewport.detail-tab-expanded #detailHeaderCard,
    #detailViewport.detail-tab-expanded #pipeline-choices {
        display: none !important;
    }
    #detailViewport.detail-tab-expanded {
        padding-bottom: 0 !important;
    }
</style>

<div class="mb-4 border-b border-[#dddddd] flex-shrink-0 flex items-center justify-between gap-3">
    <ul
        class="flex flex-nowrap overflow-hidden overflow-x-auto -mb-px text-sm font-medium text-center min-w-0 flex-1 {{ background_class }}"
        id="{{ view_id }}"
        data-tabs-toggle="#{{ view_id }}-content"
        data-tabs-active-classes="text-primary-600 border-b-2"
        data-tabs-inactive-classes="text-[#333] hover:text-primary-600 hover:border-gray-300"
        role="tablist"
        {% if background_color %}
            style="background-color: {{ background_color }}"
        {% endif %}
    >
        {% for tab in tabs %}
            <li class="me-2" role="presentation">
                <button
                    class="inline-block px-3 py-3 text-sm border-b-2 rounded-t-lg transition duration-300 w-max"
                    id="tab-{{ tab.id }}"
                    data-tabs-target="#tab-{{ tab.id }}-content"
                    type="button"
                    role="tab"
                    aria-controls="tab-{{ tab.id }}-content"
                    aria-selected="{% if active_target == 'tab-'|add:tab.id|add:'-content' %}true{% else %}false{% endif %}"
                    hx-get="{{ tab.url }}?{{request.GET.urlencode}}"
                    hx-target="#inner-tab-{{ tab.id }}-content"
                    hx-indicator="#tab-{{ tab.id }}-indicator"
                    onclick="saveActiveTab('tab-{{ tab.id }}-content', '{{ request.path }}')"
                >
                    {{ tab.title }}
                </button>
            </li>
        {% endfor %}
    </ul>
    {% if is_detail_view %}
        <button
            type="button"
            class="detail-tab-expand-btn flex items-center gap-3 text-sm p-2 rounded-md bg-transparent text-primary-600 border border-primary-600 hover:bg-primary-50 transition-colors mb-2"
            title="{{ detail_tab_expand_label }}"
            aria-label="{{ detail_tab_expand_label }}"
            aria-pressed="false"
            onclick="window.toggleDetailTabSize && window.toggleDetailTabSize(this)"
        >
            <i class="fa-solid fa-expand" aria-hidden="true"></i>
        </button>
    {% endif %}
</div>

<div id="{{ view_id }}-content" class="overflow-hidden flex-1 min-h-0">
    {% for tab in tabs %}
        <div
            class="{% if active_target != 'tab-'|add:tab.id|add:'-content' %}hidden{% endif %}"
            id="tab-{{ tab.id }}-content"
            role="tabpanel"
            aria-labelledby="tab-{{ tab.id }}"
            style="height: 100%; position: relative"
        >
            <!-- Loading Indicator Overlay -->
            <div id="tab-{{ tab.id }}-indicator" class="htmx-indicator tabloading">
                <div class="flex justify-center items-center p-4">
                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary-600"></div>
                </div>
            </div>

            <div
                class="tab-content px-3"
                id="inner-tab-{{ tab.id }}-content"
                {% if active_target %}
                    {% if active_target == 'tab-'|add:tab.id|add:'-content' %}
                        hx-get="{{ tab.url }}?{{request.GET.urlencode}}"
                        hx-trigger="load"
                        hx-swap="innerHTML"
                        hx-indicator="#tab-{{ tab.id }}-indicator"
                        hx-disinherit="*"
                    {% endif %}
                {% else %}
                    {% if forloop.first %}
                        hx-get="{{ tab.url }}?{{request.GET.urlencode}}"
                        hx-trigger="load"
                        hx-swap="innerHTML"
                        hx-indicator="#tab-{{ tab.id }}-indicator"
                        hx-disinherit="*"
                    {% endif %}
                {% endif %}
                style="height: 100%"
            >
            </div>
        </div>
    {% endfor %}
</div>

<script>
    var _saveActiveTabTimer = null;
    function saveActiveTab(tabTarget, path) {
        clearTimeout(_saveActiveTabTimer);
        _saveActiveTabTimer = setTimeout(function() {
            $.ajax({
                url: '/active-tab/',
                type: 'POST',
                data: {
                    tab_target: tabTarget,
                    path: path,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                error: function(xhr, status, error) {
                    console.error('Error saving active tab:', error);
                }
            });
        }, 500);
    }

    (function () {
        var EXPAND_LABEL = "{{ detail_tab_expand_label|escapejs }}";
        var COLLAPSE_LABEL = "{{ detail_tab_collapse_label|escapejs }}";
        var STORAGE_KEY = "detailTabExpanded";

        function readStoredExpanded() {
            try {
                return localStorage.getItem(STORAGE_KEY) === "true";
            } catch (e) {
                return false;
            }
        }

        function writeStoredExpanded(expanded) {
            try {
                localStorage.setItem(STORAGE_KEY, expanded ? "true" : "false");
            } catch (e) {
                // Ignore storage failures (private mode, quota, etc.).
            }
        }

        window.toggleDetailTabSize = function (btn) {
            var viewport = document.getElementById("detailViewport");
            if (!viewport || !btn) {
                return;
            }
            var expanded = viewport.classList.toggle("detail-tab-expanded");
            writeStoredExpanded(expanded);
            window.syncDetailTabExpandBtns(expanded);
            if (typeof window.scheduleViewportFit === "function") {
                window.scheduleViewportFit();
            }
        };

        window.syncDetailTabExpandBtns = function (expanded) {
            var viewport = document.getElementById("detailViewport");
            if (typeof expanded !== "boolean") {
                expanded = !!(viewport && viewport.classList.contains("detail-tab-expanded"));
            }
            var label = expanded ? COLLAPSE_LABEL : EXPAND_LABEL;
            document.querySelectorAll(".detail-tab-expand-btn").forEach(function (button) {
                button.setAttribute("aria-pressed", expanded ? "true" : "false");
                button.setAttribute("title", label);
                button.setAttribute("aria-label", label);
                var icon = button.querySelector("i");
                if (icon) {
                    icon.className = expanded ? "fa-solid fa-compress" : "fa-solid fa-expand";
                }
            });
        };

        window.applyStoredDetailTabExpand = function () {
            var viewport = document.getElementById("detailViewport");
            var expanded = readStoredExpanded();
            if (viewport) {
                viewport.classList.toggle("detail-tab-expanded", expanded);
            }
            window.syncDetailTabExpandBtns(expanded);
            if (typeof window.scheduleViewportFit === "function") {
                window.scheduleViewportFit();
            }
        };

        if (!window._detailTabExpandBound) {
            window._detailTabExpandBound = true;
            document.body.addEventListener("htmx:afterSettle", function () {
                window.syncDetailTabExpandBtns();
            });
            window.addEventListener("pageshow", function () {
                window.applyStoredDetailTabExpand();
            });
        }
        window.applyStoredDetailTabExpand();
    })();
</script>
