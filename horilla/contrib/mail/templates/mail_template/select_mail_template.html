<div class="p-5">
    {% modal_header _("Select Mail Template") button_id="close" %}

    <form method="post" class="space-y-3">
        {% csrf_token %}
        <div>{{ form.template }}</div>
        <div class="flex justify-end">
            {% btn _("Select Template") type="button" onclick="selectTemplate()" %}
        </div>
    </form>
</div>

<script>
    function selectTemplate() {
        const templateSelect = document.querySelector('select[name="template"]');

        if (!templateSelect || !templateSelect.value) {
            alert('Please select a template');
            return;
        }

        const selectedOption = templateSelect.options[templateSelect.selectedIndex];
        const templateId = templateSelect.value;

        fetch(`{% url 'mail:get_template_content' %}?template_id=${templateId}`, {
            method: 'GET',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                let targetWindow = window;

                if (window.opener && window.opener.$) {
                    targetWindow = window.opener;
                } else if (window.parent && window.parent !== window && window.parent.$) {
                    targetWindow = window.parent;
                } else if (window.top && window.top !== window && window.top.$) {
                    targetWindow = window.top;
                }


                var $editor = targetWindow.$ ? targetWindow.$('#message_content') : null;
                if ($editor && $editor.length && targetWindow.HorillaRichText) {
                    if (targetWindow.HorillaRichText.hasEditor($editor)) {
                        // Set the body content
                        targetWindow.HorillaRichText.setContent($editor, data.body);

                        // Set the subject if available
                        if (data.subject) {
                            const $subjectField = targetWindow.$('#id_subject, input[name="subject"]');
                            if ($subjectField.length) {
                                $subjectField.val(data.subject);
                            }
                        }

                        closeModal();
                    } else {
                        console.error('Summernote not initialized');
                    }
                } else {
                    // Store both body and subject in localStorage
                    localStorage.setItem('selectedTemplate', JSON.stringify({
                        body: data.body,
                        subject: data.subject || '',
                        timestamp: Date.now()
                    }));
                    closeModal();
                }
            } else {
                console.error('Error getting template content:', data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    }
</script>
